<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
  <title id="title">TeaPulse Architecture and Dual-Endpoint Request Flow</title>
  <desc id="desc">Shared GiteaKit Swift 6 core connecting iOS, iPadOS, macOS, Widgets, Live Activities, and Share Extensions to Gitea over LAN 800ms healthz race or TLS reverse proxy.</desc>
  <defs>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#A78BFA" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#FBBF24" />
    </marker>
  </defs>

  <rect width="1200" height="430" rx="16" fill="#0B0D13" />

  <!-- Subtle dark technical grid -->
  <g stroke="#1A1E2B" stroke-width="1" opacity="0.7">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="382" y1="76" x2="382" y2="430" stroke-dasharray="4 6" />
    <line x1="836" y1="76" x2="836" y2="430" stroke-dasharray="4 6" />
  </g>

  <!-- Header -->
  <text x="44" y="42" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="18" font-weight="700">TeaPulse Architecture · Shared Swift 6 Core &amp; Dual-Endpoint Probe</text>
  <text x="44" y="61" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="12">One shared GiteaKit engine drives all Apple clients, extensions, and local security boundaries</text>
  <rect x="928" y="25" width="228" height="28" rx="14" fill="#12151E" stroke="#10B981" stroke-width="1" />
  <circle cx="945" cy="39" r="4" fill="#10B981" />
  <text x="957" y="43" fill="#34D399" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600">Swift 6 · Strict Concurrency</text>

  <!-- Column 1 Title -->
  <text x="44" y="102" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.8">1. APPLE CLIENT SURFACES</text>

  <!-- Surface Cards -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif">
    <rect x="44" y="116" width="286" height="62" rx="12" fill="#12151E" stroke="#23293A" stroke-width="1.2" />
    <rect x="56" y="129" width="6" height="36" rx="3" fill="#10B981" />
    <text x="72" y="143" fill="#F1F5F9" font-size="14" font-weight="600">iOS &amp; iPadOS App</text>
    <text x="72" y="162" fill="#94A3B8" font-size="11.5">Pulse · Repos · PR Review · Actions · Ops</text>

    <rect x="44" y="190" width="286" height="62" rx="12" fill="#12151E" stroke="#23293A" stroke-width="1.2" />
    <rect x="56" y="203" width="6" height="36" rx="3" fill="#10B981" />
    <text x="72" y="217" fill="#F1F5F9" font-size="14" font-weight="600">macOS Universal + Menu Bar</text>
    <text x="72" y="236" fill="#94A3B8" font-size="11.5">Split workspace · &#x2318;K Palette · Build monitor</text>

    <rect x="44" y="264" width="286" height="62" rx="12" fill="#12151E" stroke="#23293A" stroke-width="1.2" />
    <rect x="56" y="277" width="6" height="36" rx="3" fill="#A78BFA" />
    <text x="72" y="291" fill="#F1F5F9" font-size="14" font-weight="600">Widgets &amp; Live Activity</text>
    <text x="72" y="310" fill="#94A3B8" font-size="11.5">WidgetKit · ActivityKit Dynamic Island</text>

    <rect x="44" y="338" width="286" height="62" rx="12" fill="#12151E" stroke="#23293A" stroke-width="1.2" />
    <rect x="56" y="351" width="6" height="36" rx="3" fill="#FBBF24" />
    <text x="72" y="365" fill="#F1F5F9" font-size="14" font-weight="600">Share Extensions (iOS / macOS)</text>
    <text x="72" y="384" fill="#94A3B8" font-size="11.5">Web URL &#x2192; teapulse:// route relay</text>
  </g>

  <!-- Column 2 Container: GiteaKit Core -->
  <text x="412" y="102" fill="#34D399" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.8">2. SHARED GITEAKIT CORE &amp; STATE</text>
  <rect x="412" y="116" width="386" height="284" rx="14" fill="#12151E" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.55" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif">
    <!-- Box A: Endpoint Probe -->
    <rect x="430" y="132" width="350" height="66" rx="10" fill="#1A1E2B" stroke="#23293A" stroke-width="1" />
    <text x="446" y="154" fill="#34D399" font-size="13.5" font-weight="700">EndpointProbeService · 800ms Race</text>
    <text x="446" y="173" fill="#94A3B8" font-size="11.5">Races LAN /api/healthz &#x2192; TLS proxy fallback</text>
    <text x="446" y="189" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5">Preserves :port, subpath &amp; custom headers</text>

    <!-- Box B: GiteaClient -->
    <rect x="430" y="210" width="350" height="66" rx="10" fill="#1A1E2B" stroke="#23293A" stroke-width="1" />
    <text x="446" y="232" fill="#F1F5F9" font-size="13.5" font-weight="700">GiteaClient &amp; Workspace Store</text>
    <text x="446" y="251" fill="#94A3B8" font-size="11.5">Repos &#xB7; Orgs &#xB7; Starred &#xB7; Branches &#xB7; PR Diff</text>
    <text x="446" y="267" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5">Range bytes= logs &#xB7; Secrets/Vars &#xB7; Runners</text>

    <!-- Box C: Pure Swift Parsers -->
    <rect x="430" y="288" width="170" height="94" rx="10" fill="#1A1E2B" stroke="#23293A" stroke-width="1" />
    <text x="444" y="309" fill="#A78BFA" font-size="13" font-weight="700">Native Parsers</text>
    <text x="444" y="328" fill="#94A3B8" font-size="11">UnifiedDiffParser</text>
    <text x="444" y="344" fill="#94A3B8" font-size="11">ANSITerminalParser</text>
    <text x="444" y="360" fill="#94A3B8" font-size="11">Markdown + Mermaid</text>
    <text x="444" y="375" fill="#94A3B8" font-size="11">DeepLinkRouter</text>

    <!-- Box D: Local Security Boundary -->
    <rect x="610" y="288" width="170" height="94" rx="10" fill="#1A1E2B" stroke="#23293A" stroke-width="1" />
    <text x="624" y="309" fill="#FBBF24" font-size="13" font-weight="700">Local Boundary</text>
    <text x="624" y="328" fill="#94A3B8" font-size="11">Keychain PAT Storage</text>
    <text x="624" y="344" fill="#94A3B8" font-size="11">Custom Header Vault</text>
    <text x="624" y="360" fill="#94A3B8" font-size="11">AppGroupBridge IPC</text>
    <text x="624" y="375" fill="#94A3B8" font-size="11">Offline --demo-mode</text>
  </g>

  <!-- Column 3 Title -->
  <text x="870" y="102" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.8">3. SELF-HOSTED GITEA TARGETS</text>

  <!-- Target Cards -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif">
    <rect x="870" y="116" width="286" height="84" rx="12" fill="#12151E" stroke="#10B981" stroke-width="1.2" />
    <rect x="884" y="128" width="76" height="20" rx="6" fill="#047857" opacity="0.35" />
    <text x="893" y="142" fill="#34D399" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">PRIORITY 1</text>
    <text x="970" y="142" fill="#F1F5F9" font-size="14" font-weight="600">LAN Direct Endpoint</text>
    <text x="884" y="164" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11">http://10.0.0.x:23000/api/healthz</text>
    <text x="884" y="184" fill="#94A3B8" font-size="11">Low-latency Wi-Fi / VPN direct tunnel</text>

    <rect x="870" y="216" width="286" height="84" rx="12" fill="#12151E" stroke="#A78BFA" stroke-width="1.2" />
    <rect x="884" y="228" width="76" height="20" rx="6" fill="#6D28D9" opacity="0.35" />
    <text x="893" y="242" fill="#A78BFA" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">FALLBACK</text>
    <text x="970" y="242" fill="#F1F5F9" font-size="14" font-weight="600">TLS Reverse Proxy</text>
    <text x="884" y="264" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11">https://git.example.com:8443/gitea</text>
    <text x="884" y="284" fill="#94A3B8" font-size="11">Nginx / Caddy · Custom port &amp; headers</text>

    <rect x="870" y="316" width="286" height="84" rx="12" fill="#12151E" stroke="#23293A" stroke-width="1.2" />
    <rect x="884" y="328" width="76" height="20" rx="6" fill="#B45309" opacity="0.3" />
    <text x="896" y="342" fill="#FBBF24" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">OPTIONAL</text>
    <text x="970" y="342" fill="#F1F5F9" font-size="14" font-weight="600">Push Relay &amp; SSH</text>
    <text x="884" y="364" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11">https://push.example.com/webhook</text>
    <text x="884" y="384" fill="#94A3B8" font-size="11">Custom SSH port :2222 clone overrides</text>
  </g>

  <!-- Connectors Column 1 -> Column 2 -->
  <path d="M 330 147 C 372 147, 372 228, 412 228" fill="none" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrow-emerald)" />
  <path d="M 330 221 C 368 221, 376 244, 412 244" fill="none" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrow-emerald)" />
  <path d="M 330 295 C 370 295, 376 328, 412 328" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-purple)" />
  <path d="M 330 369 C 370 369, 376 352, 412 352" fill="none" stroke="#FBBF24" stroke-width="1.6" marker-end="url(#arrow-amber)" />

  <!-- Connectors Column 2 -> Column 3 -->
  <path d="M 798 158 C 834 158, 834 158, 870 158" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <path d="M 798 176 C 834 176, 834 256, 870 256" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-purple)" />
  <path d="M 798 258 C 834 258, 834 358, 870 358" fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#arrow-amber)" />
</svg>
